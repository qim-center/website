bio: "Jon Sporring received his Master and Ph.D. degree from the Department of Computer Science, University of Copenhagen, Denmark. In 2007-2012 and again since 2015 he is Vice-Chair for Research at Department of Computer Science, University of Copenhagen. His primary research field is Computer Science and particularly mathematical and medical image processing, computer graphics, information theory, and pattern recognition."
