bio: "Jon Sporring earned his Master’s (1995) and Ph.D. (1998) from the University of Copenhagen, with part of his Ph.D. conducted at the IBM Research Center in California. Afterward, he held research roles in Greece and at the University of Copenhagen’s 3D-Lab, and was an associate professor at DIKU from 2003 to 2018. He also worked part-time at Nordic Bioscience (2008–2009), was a visiting professor at McGill University (2012–2013), and co-founded DigiCorpus ApS, serving as Chief Research Officer (2012–2016). He has held multiple leadership roles at DIKU, and since 2018 has been a full professor, as well as Deputy Head of QIM since 2019."
