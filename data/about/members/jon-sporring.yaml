bio: "Jon Sporring is a full professor at DIKU, University of Copenhagen, where he is the head of the Image Analysis, Computational Modelling, and Geometry
 Section. He earned his Ph.D. in 1998, including research at IBM Research Center, and has held academic and industry roles, including postdoc at Foundation for Research and Technology - Hellas, visiting professor at McGill University, and co-founder of DigiCorpus ApS."
