bio: "Vedrana Dahl develops methods for image analysis and geometry processing, with a particular focus on geometric models for the analysis of volumetric data. Her work includes volumetric and tomographic segmentation, as well as methods based on deformable meshes. She has developed image analysis tools with applications in materials science, industrial inspection, and biomedicine."
