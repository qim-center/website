bio: "Julia is a scientific programmer and bioimage analyst working at the image analysis core facility (IACF) in Copenhagen, which is part of the Danish BioImaging Infrastructure (DBI-Infra). At IACF, she supports researchers and life scientists in analyzing their bioimage data through tailored software solutions, workshops, and consultations. In collaboration with the IMAGE section of DIKU and the Qim Center, Julia works on making bioimage processing tools available to life scientists in a user-friendly way. She holds a master’s degree in computer science from the University of Freiburg, specializing on unsupervised deep learning methods for image and video analysis."
