bio: "Anders is the Head of the QIM Center and the Head of the Section for Visual Computing at DTU Compute since 2015. He finished his PhD at DTU in 2009 and has been at DTU since. His research focuses on a variety of things related to image analysis, where his main focus has been on quantification of 3D volumetric data."
