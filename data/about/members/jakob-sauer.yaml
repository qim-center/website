bio: "Jakob is the Scientific Director of the Qim Center and Associate Professor at DTU Compute. His background is in mathematics, algorithms and software for tomographic reconstruction, especially X-ray and neutron CT. He is one of the founders of the CIL (Core Imaging Library) and CUQIpy python imaging libraries."
