bio: "Emanuel works as a Researcher at the Department of Experimental Medical Science at the Faculty of Medicine, Lund University and as a LINXS Co-Director responsible for the focus area of Life Science. He also works as a Lund University Node Coordinator for InfraVis – a Swedish National Research Infrastructure for Data Visualization, and as Coordinator for CIPA – a cross faculty infrastructure for image processing and analysis at Lund University. His work includes everything from experimental planning, image acquisition, reconstruction, processing, analysis, and visualization of X-ray and Neutron tomography datasets. Emanuel also very dedicated to finding new pedagogical ways of teaching tomography and image reconstruction."
