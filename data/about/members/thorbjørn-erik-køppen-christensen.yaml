bio: "Thorbjørn is a beamline scientist at the DanMAX beamline at the MAX IV synchrotron.
In his own research, Thorbjørn studies biomineralization in a wide variety of systems.
Furthermore, Thorbjørn develops pipelines for analyzing multi TiB datasets for both imaging and diffraction."
